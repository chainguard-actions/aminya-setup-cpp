name: Test setup-cpp compiler input shorthand
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: setup
        uses: .
        with:
          compiler: "gcc"
          cmake: "true"
          ninja: "true"
      - name: Assert gcc compiler is installed via compiler input
        run: |
          echo "Checking gcc via compiler input..."
          if ! command -v gcc &>/dev/null; then
            echo "FAIL: gcc not found in PATH"
            exit 1
          fi
          echo "gcc: $(gcc --version | head -1)"
          echo "PASS: gcc installed via compiler input"
      - name: Assert cmake is installed
        run: |
          echo "Checking cmake..."
          if ! command -v cmake &>/dev/null; then
            echo "FAIL: cmake not found in PATH"
            exit 1
          fi
          echo "cmake: $(cmake --version | head -1)"
          echo "PASS: cmake installed"
      - name: Assert ninja is installed
        run: |
          echo "Checking ninja..."
          if ! command -v ninja &>/dev/null; then
            echo "FAIL: ninja not found in PATH"
            exit 1
          fi
          echo "ninja: $(ninja --version)"
          echo "PASS: ninja installed"
