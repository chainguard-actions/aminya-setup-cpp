name: Test analysis tools inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          gcovr: "false"
          cpplint: "false"
          flawfinder: "false"
          lizard: "false"
          infer: "false"
          kcov: "false"
          opencppcoverage: "false"
      - name: Assert action ran without error
        run: |
          echo "PASS: analysis tools inputs accepted"
