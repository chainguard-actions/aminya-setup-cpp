name: Test compiler input with gcc
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: setup
        uses: .
        with:
          compiler: "gcc"
      - name: Assert gcc is installed
        run: |
          echo "Checking gcc installation..."
          if ! command -v gcc &>/dev/null; then
            echo "FAIL: gcc not found in PATH"
            exit 1
          fi
          GCC_VERSION=$(gcc --version | head -1)
          echo "gcc version: $GCC_VERSION"
          echo "PASS: gcc is installed"
      - name: Assert g++ is installed
        run: |
          echo "Checking g++ installation..."
          if ! command -v g++ &>/dev/null; then
            echo "FAIL: g++ not found in PATH"
            exit 1
          fi
          GPP_VERSION=$(g++ --version | head -1)
          echo "g++ version: $GPP_VERSION"
          echo "PASS: g++ is installed"
      - name: Assert gcc can compile a simple program
        run: |
          echo "Testing gcc compilation..."
          cat > /tmp/hello.c <<'EOF'
          #include <stdio.h>
          int main() {
            printf("Hello, World!\n");
            return 0;
          }
          EOF
          gcc /tmp/hello.c -o /tmp/hello
          OUTPUT=$(/tmp/hello)
          echo "Program output: $OUTPUT"
          if [ "$OUTPUT" != "Hello, World!" ]; then
            echo "FAIL: expected 'Hello, World!' but got '$OUTPUT'"
            exit 1
          fi
          echo "PASS: gcc compiled and ran successfully"
