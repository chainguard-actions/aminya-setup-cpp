name: Test static analysis tools
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          cppcheck: "true"
          cpplint: "false"
          flawfinder: "false"
          lizard: "false"
          infer: "false"
      - name: Assert cppcheck installed
        run: |
          if ! command -v cppcheck &>/dev/null; then
            echo "FAIL: cppcheck not found in PATH"
            exit 1
          fi
          echo "PASS: cppcheck found at $(command -v cppcheck)"
