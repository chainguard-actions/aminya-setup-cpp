name: Test cpplint installation
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: setup
        uses: .
        with:
          cpplint: "true"
      - name: Assert cpplint is installed
        run: |
          echo "Checking cpplint installation..."
          if ! command -v cpplint &>/dev/null; then
            echo "FAIL: cpplint not found in PATH"
            exit 1
          fi
          CPPLINT_VERSION=$(cpplint --version 2>&1 | head -1 || true)
          echo "cpplint version: $CPPLINT_VERSION"
          echo "PASS: cpplint is installed"
