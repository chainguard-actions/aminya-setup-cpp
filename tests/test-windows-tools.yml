name: Test Windows-specific tools (graceful failure on Linux)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          msvc: "false"
          cl: "false"
          msbuild: "false"
          visualstudio: "false"
          choco: "false"
          vcvarsall: "false"
          opencppcoverage: "false"
          kcov: "false"
          infer: "false"
      - name: Assert action ran (inputs accepted)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded with Windows-specific inputs set to false"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected on Linux for Windows-only tools)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
