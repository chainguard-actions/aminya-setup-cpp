name: Test cache tools
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          sccache: "true"
          cache-tools: "false"
      - name: Assert sccache is installed
        run: |
          if ! command -v sccache &>/dev/null; then
            echo "FAIL: sccache not found in PATH"
            exit 1
          fi
          echo "PASS: sccache found"
