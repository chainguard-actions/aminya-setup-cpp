name: Test Windows and macOS specific inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          msvc: "false"
          cl: "false"
          msbuild: "false"
          visualstudio: "false"
          vcvarsall: "false"
          choco: "false"
          brew: "false"
          opencppcoverage: "false"
      - name: Assert action completed
        run: |
          echo "PASS: action completed with Windows/macOS-specific inputs (no-op on Linux)"
