name: Test conan installation
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: setup
        uses: .
        with:
          conan: "true"
      - name: Assert conan is installed
        run: |
          echo "conan version:"
          conan --version
          if ! conan --version; then
            echo "FAIL: conan not found or not working"
            exit 1
          fi
          echo "PASS: conan is installed"
