name: Test build tools inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          make: "true"
          meson: "false"
          conan: "false"
          task: "false"
          vcpkg: "false"
      - name: Assert make is installed
        run: |
          if ! command -v make &>/dev/null; then
            echo "FAIL: make not found in PATH"
            exit 1
          fi
          echo "PASS: make is installed"
