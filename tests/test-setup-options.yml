name: Test setup options
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          architecture: "amd64"
          cache-tools: "false"
          setup-cpp: "false"
          node-package-manager: "npm"
          cmake: "true"
      - name: Assert cmake installed
        run: |
          if ! command -v cmake &>/dev/null; then
            echo "FAIL: cmake not found in PATH"
            exit 1
          fi
          echo "PASS: cmake found at $(command -v cmake)"
