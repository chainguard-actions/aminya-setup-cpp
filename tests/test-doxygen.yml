name: Test doxygen installation
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: setup
        uses: .
        with:
          doxygen: "true"
      - name: Assert doxygen is installed
        run: |
          echo "Checking doxygen installation..."
          if ! command -v doxygen &>/dev/null; then
            echo "FAIL: doxygen not found in PATH"
            exit 1
          fi
          DOXYGEN_VERSION=$(doxygen --version)
          echo "doxygen version: $DOXYGEN_VERSION"
          echo "PASS: doxygen is installed"
