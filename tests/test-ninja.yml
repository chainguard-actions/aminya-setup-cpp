name: Test ninja installation
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: setup
        uses: .
        with:
          ninja: "true"
      - name: Assert ninja is installed
        run: |
          echo "ninja version:"
          ninja --version
          if ! ninja --version; then
            echo "FAIL: ninja not found or not working"
            exit 1
          fi
          echo "PASS: ninja is installed"
