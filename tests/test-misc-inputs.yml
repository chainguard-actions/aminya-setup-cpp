name: Test miscellaneous inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          powershell: "true"
          pwsh: "false"
          nala: "false"
          cache-tools: "false"
          architecture: "amd64"
      - name: Assert powershell is installed
        run: |
          echo "Checking powershell installation"
          if ! command -v pwsh &>/dev/null; then
            echo "FAIL: pwsh not found"
            exit 1
          fi
          echo "PASS: pwsh found"
