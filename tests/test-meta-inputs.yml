name: Test meta inputs (architecture, cache-tools, setup-cpp, node-package-manager)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          architecture: "x86_64"
          cache-tools: "false"
          setup-cpp: "true"
          node-package-manager: "npm"
          cmake: "true"
      - name: Assert cmake is available (verifying action ran successfully)
        run: |
          echo "Checking cmake..."
          if ! command -v cmake &>/dev/null; then
            echo "FAIL: cmake not found"
            exit 1
          fi
          echo "PASS: cmake found at $(command -v cmake)"
