name: Test llvm installation
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: setup
        uses: .
        with:
          llvm: "true"
      - name: Assert llvm tools are installed
        run: |
          echo "clang version:"
          clang --version || clang-* --version
          if ! (clang --version 2>/dev/null || ls /usr/bin/clang-* 2>/dev/null); then
            echo "FAIL: clang/llvm not found"
            exit 1
          fi
          echo "PASS: llvm/clang is installed"
