name: Test graphviz input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          graphviz: "true"
      - name: Assert graphviz is installed
        run: |
          if ! command -v dot &>/dev/null; then
            echo "FAIL: graphviz (dot) not found in PATH"
            exit 1
          fi
          echo "PASS: graphviz is installed"
