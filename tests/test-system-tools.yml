name: Test system tools (graphviz, nala, powershell)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          graphviz: "true"
          nala: "true"
          powershell: "true"
          pwsh: "true"
      - name: Assert graphviz is installed
        run: |
          if ! command -v dot &>/dev/null; then
            echo "FAIL: graphviz (dot) not found"
            exit 1
          fi
          echo "PASS: graphviz found at $(command -v dot)"
      - name: Assert powershell is installed
        run: |
          if ! command -v pwsh &>/dev/null; then
            echo "FAIL: pwsh not found"
            exit 1
          fi
          echo "PASS: pwsh found at $(command -v pwsh)"
