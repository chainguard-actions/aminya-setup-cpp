name: Test gcovr installation
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          gcovr: "true"
      - name: Assert gcovr is installed
        run: |
          echo "Checking gcovr installation..."
          if ! command -v gcovr &>/dev/null; then
            echo "FAIL: gcovr not found in PATH"
            exit 1
          fi
          GCOVR_VERSION=$(gcovr --version | head -1)
          echo "gcovr version: $GCOVR_VERSION"
          echo "PASS: gcovr is installed"
