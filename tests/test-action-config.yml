name: Test action configuration inputs (architecture, cache-tools, timeout)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          architecture: "x64"
          cache-tools: "false"
          timeout: "20"
          ninja: "true"
      - name: Assert ninja is installed (action ran successfully with config inputs)
        run: |
          if ! command -v ninja &>/dev/null; then
            echo "FAIL: ninja not found"
            exit 1
          fi
          echo "PASS: ninja found at $(command -v ninja)"
