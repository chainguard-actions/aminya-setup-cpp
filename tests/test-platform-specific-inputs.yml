name: Test platform-specific inputs (apple-clang, msvc, choco, brew, etc.)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          apple-clang: "false"
          apple-llvm: "false"
          appleclang: "false"
          applellvm: "false"
          msvc: "false"
          cl: "false"
          msbuild: "false"
          visualstudio: "false"
          vcvarsall: "false"
          choco: "false"
          brew: "false"
          opencppcoverage: "false"
          infer: "false"
          kcov: "false"
          # Install something verifiable on Linux to confirm action ran
          cmake: "true"
      - name: Assert cmake is installed (action ran successfully with platform inputs)
        run: |
          if ! command -v cmake &>/dev/null; then
            echo "FAIL: cmake not found"
            exit 1
          fi
          echo "PASS: cmake found at $(command -v cmake)"
