name: Test utility tools
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          python: "false"
          git: "false"
          tar: "false"
          task: "false"
          sevenzip: "true"
      - name: Assert 7z installed
        run: |
          if ! command -v 7z &>/dev/null && ! command -v 7za &>/dev/null && ! command -v 7zz &>/dev/null; then
            echo "FAIL: 7z not found in PATH"
            exit 1
          fi
          echo "PASS: 7z found"
