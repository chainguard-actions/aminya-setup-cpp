name: Test cmake extras inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          cmake-format: "false"
          cmakeformat: "false"
          cmake-lint: "false"
          cmakelint: "false"
          cmakelang: "false"
      - name: Assert action ran without error
        run: |
          echo "PASS: cmake extras inputs accepted"
