name: Test cmake tools
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          cmakelang: "true"
          cmake-lint: "false"
          cmakelint: "false"
          cmake-format: "false"
          cmakeformat: "false"
      - name: Assert cmake-lint is installed (via cmakelang)
        run: |
          if ! command -v cmake-lint &>/dev/null; then
            echo "FAIL: cmake-lint not found in PATH"
            exit 1
          fi
          echo "PASS: cmake-lint found"
      - name: Assert cmake-format is installed (via cmakelang)
        run: |
          if ! command -v cmake-format &>/dev/null; then
            echo "FAIL: cmake-format not found in PATH"
            exit 1
          fi
          echo "PASS: cmake-format found"
