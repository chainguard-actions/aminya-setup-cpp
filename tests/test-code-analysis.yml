name: Test code analysis tools
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          cppcheck: "true"
          cpplint: "true"
          flawfinder: "true"
          lizard: "true"
      - name: Assert cppcheck is installed
        run: |
          if ! command -v cppcheck &>/dev/null; then
            echo "FAIL: cppcheck not found in PATH"
            exit 1
          fi
          echo "PASS: cppcheck found"
      - name: Assert cpplint is installed
        run: |
          if ! command -v cpplint &>/dev/null; then
            echo "FAIL: cpplint not found in PATH"
            exit 1
          fi
          echo "PASS: cpplint found"
      - name: Assert flawfinder is installed
        run: |
          if ! command -v flawfinder &>/dev/null; then
            echo "FAIL: flawfinder not found in PATH"
            exit 1
          fi
          echo "PASS: flawfinder found"
      - name: Assert lizard is installed
        run: |
          if ! command -v lizard &>/dev/null; then
            echo "FAIL: lizard not found in PATH"
            exit 1
          fi
          echo "PASS: lizard found"
