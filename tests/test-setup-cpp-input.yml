name: Test setup-cpp and node-package-manager inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          setup-cpp: "true"
          node-package-manager: "npm"
      - name: Assert setup-cpp is installed
        run: |
          if ! command -v setup-cpp &>/dev/null; then
            echo "FAIL: setup-cpp not found"
            exit 1
          fi
          echo "PASS: setup-cpp found at $(command -v setup-cpp)"
