name: Test documentation and coverage tools (doxygen, graphviz, sccache, kcov)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          doxygen: "true"
          graphviz: "true"
          sccache: "true"
          kcov: "true"
      - name: Assert doxygen is available
        run: |
          echo "Checking doxygen..."
          if ! command -v doxygen &>/dev/null; then
            echo "FAIL: doxygen not found"
            exit 1
          fi
          echo "PASS: doxygen found at $(command -v doxygen)"
      - name: Assert graphviz (dot) is available
        run: |
          echo "Checking graphviz (dot)..."
          if ! command -v dot &>/dev/null; then
            echo "FAIL: dot (graphviz) not found"
            exit 1
          fi
          echo "PASS: dot found at $(command -v dot)"
      - name: Assert sccache is available
        run: |
          echo "Checking sccache..."
          if ! command -v sccache &>/dev/null; then
            echo "FAIL: sccache not found"
            exit 1
          fi
          echo "PASS: sccache found at $(command -v sccache)"
