name: Test clang tools
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          clang: "true"
          llvm: "false"
          clang-tidy: "false"
          clang-format: "false"
          clangtidy: "false"
          clangformat: "false"
      - name: Assert clang installed
        run: |
          if ! command -v clang &>/dev/null; then
            echo "FAIL: clang not found in PATH"
            exit 1
          fi
          echo "PASS: clang found at $(command -v clang)"
