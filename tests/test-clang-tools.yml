name: Test clang tools (clang-format, clang-tidy, llvm)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          llvm: "true"
          clang-format: "true"
          clangformat: "true"
          clang-tidy: "true"
          clangtidy: "true"
      - name: Assert clang-format is installed
        run: |
          if ! command -v clang-format &>/dev/null; then
            echo "FAIL: clang-format not found"
            exit 1
          fi
          echo "PASS: clang-format found at $(command -v clang-format)"
      - name: Assert clang-tidy is installed
        run: |
          if ! command -v clang-tidy &>/dev/null; then
            echo "FAIL: clang-tidy not found"
            exit 1
          fi
          echo "PASS: clang-tidy found at $(command -v clang-tidy)"
