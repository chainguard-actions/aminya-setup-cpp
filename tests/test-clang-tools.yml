name: Test clang tools
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          clang: "true"
          clang-tidy: "true"
          clang-format: "true"
          clangtidy: "false"
          clangformat: "false"
      - name: Assert clang is installed
        run: |
          echo "Checking clang installation"
          if ! command -v clang &>/dev/null && ! command -v clang-* &>/dev/null; then
            echo "FAIL: clang not found"
            exit 1
          fi
          echo "PASS: clang found"
