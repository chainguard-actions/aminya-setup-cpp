name: Test cmake and ninja installation together
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: setup
        uses: .
        with:
          cmake: "true"
          ninja: "true"
      - name: Assert cmake is installed
        run: |
          echo "Checking cmake installation..."
          if ! command -v cmake &>/dev/null; then
            echo "FAIL: cmake not found in PATH"
            exit 1
          fi
          CMAKE_VERSION=$(cmake --version | head -1)
          echo "cmake version: $CMAKE_VERSION"
          echo "PASS: cmake is installed"
      - name: Assert ninja is installed
        run: |
          echo "Checking ninja installation..."
          if ! command -v ninja &>/dev/null; then
            echo "FAIL: ninja not found in PATH"
            exit 1
          fi
          NINJA_VERSION=$(ninja --version)
          echo "ninja version: $NINJA_VERSION"
          echo "PASS: ninja is installed"
      - name: Assert cmake can find ninja
        run: |
          echo "Verifying cmake can use ninja as generator..."
          TMPDIR=$(mktemp -d)
          cat > "$TMPDIR/CMakeLists.txt" <<'EOF'
          cmake_minimum_required(VERSION 3.10)
          project(HelloTest)
          EOF
          cmake -G Ninja -S "$TMPDIR" -B "$TMPDIR/build" 2>&1 | tail -5
          echo "PASS: cmake with ninja generator works"
