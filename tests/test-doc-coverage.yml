name: Test documentation and coverage tools
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          doxygen: "true"
          graphviz: "false"
          kcov: "false"
          sccache: "false"
      - name: Assert doxygen installed
        run: |
          if ! command -v doxygen &>/dev/null; then
            echo "FAIL: doxygen not found in PATH"
            exit 1
          fi
          echo "PASS: doxygen found at $(command -v doxygen)"
