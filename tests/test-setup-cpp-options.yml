name: Test setup-cpp options
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          setup-cpp: "false"
          node-package-manager: "npm"
          architecture: "x64"
          cmake: "true"
      - name: Assert cmake is installed (action ran successfully with options)
        run: |
          if ! command -v cmake &>/dev/null; then
            echo "FAIL: cmake not found in PATH"
            exit 1
          fi
          echo "PASS: cmake found, action ran with setup-cpp/node-package-manager/architecture inputs"
